<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Infotainment Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #162447 50%, #1f4068 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .greeting {
            font-size: 1.1em;
            color: #00ffff;
        }

        .status-info {
            display: flex;
            gap: 30px;
            align-items: center;
            color: #a0d8d8;
        }

        .time {
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
        }

        .date {
            font-size: 0.95em;
        }

        .app-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px;
        }

        .app-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .app-title h1 {
            font-size: 3em;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00ffff, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .app-title .subtitle {
            color: #7fb3d5;
            font-size: 1em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .main-nav {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 15px;
            margin-bottom: 50px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-btn {
            padding: 20px 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 16px;
            color: #a0d8d8;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 400;
            transition: all 0.4s ease;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 180, 255, 0.1));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .nav-btn:hover::before {
            opacity: 1;
        }

        .nav-btn:hover {
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3),
                        inset 0 0 20px rgba(0, 255, 255, 0.1);
            transform: translateY(-5px);
            color: #00ffff;
        }

        .nav-btn.active {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4),
                        inset 0 0 30px rgba(0, 255, 255, 0.1);
        }

        .nav-icon {
            font-size: 1.6em;
            margin-bottom: 8px;
            display: block;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.8);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.75em;
            line-height: 20px;
            text-align: center;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 255, 255, 0.1);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .search-bar {
            margin-bottom: 30px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 40px 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 25px;
            color: #a0d8d8;
            font-size: 0.95em;
            transition: all 0.3s ease;
            position: relative;
        }

        .search-input::placeholder {
            color: rgba(160, 216, 216, 0.5);
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #00ffff;
        }

        .search-input::placeholder {
            color: rgba(160, 216, 216, 0.5);
        }

        .search-clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0d8d8;
            cursor: pointer;
            font-size: 1.2em;
            padding: 4px;
            display: none;
            transition: color 0.3s;
        }

        .search-clear-btn:hover {
            color: #00ffff;
        }

        .search-input.active ~ .search-clear-btn {
            display: block;
        }

        .search-info {
            margin-top: 10px;
            font-size: 0.9em;
            color: #7fb3d5;
        }

        .genre-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .genre-tab {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 25px;
            color: #a0d8d8;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .genre-tab:hover {
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #00ffff;
        }

        .genre-tab.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0, 255, 255, 0.3),
                        inset 0 0 30px rgba(0, 255, 255, 0.05);
            border-color: rgba(0, 255, 255, 0.5);
        }

        .item-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a3e 0%, #2a4858 100%);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            position: relative;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a3e 0%, #2a4858 100%);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .thumbnail-retry {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 180, 216, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .thumbnail-retry:hover {
            background: rgba(0, 180, 216, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .item-content {
            padding: 20px;
        }

        .item-title {
            font-size: 1.05em;
            font-weight: 500;
            margin-bottom: 8px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .item-meta {
            color: #7fb3d5;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .item-description {
            font-size: 0.85em;
            color: #9eb8c5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.6;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 70px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00b4d8, #0096c7);
            color: white;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #00d4ff, #00b4d8);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #a0d8d8;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.4);
            color: #00ffff;
        }

        .btn-heart {
            background: none;
            border: none;
            color: #a0d8d8;
            font-size: 1.2em;
            cursor: pointer;
            padding: 8px;
            transition: all 0.3s ease;
        }

        .btn-heart:hover {
            color: #ff6b6b;
            transform: scale(1.2);
        }

        .btn-heart.favorited {
            color: #ff6b6b;
        }

        .load-more-container {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
        }

        .error-card {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.5);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: #ff6b6b;
        }

        .error-card-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .error-card-message {
            color: #9eb8c5;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2em;
            cursor: pointer;
            color: #7fb3d5;
            line-height: 1;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .player-container {
            width: 100%;
            height: 500px;
            margin: 20px 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .player-container.game {
            height: 600px;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #00ffff;
            padding-right: 40px;
            letter-spacing: 1px;
        }

        .modal-meta {
            color: #7fb3d5;
            margin-bottom: 15px;
        }

        .no-content, .error {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #7fb3d5;
            font-size: 1.1em;
        }

        .error {
            color: #ff6b6b;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            background: rgba(0, 180, 216, 0.3);
            backdrop-filter: blur(10px);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
            background: rgba(0, 180, 216, 0.5);
        }

        @media (max-width: 1024px) {
            .main-nav {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-nav {
                grid-template-columns: repeat(3, 1fr);
            }

            .status-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .status-info {
                flex-direction: column;
                gap: 5px;
            }

            .app-title h1 {
                font-size: 2em;
            }

            .search-input {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .main-nav {
                grid-template-columns: repeat(2, 1fr);
            }

            .app-container {
                padding: 20px;
            }

            .item-actions {
                flex-direction: column;
            }

            .btn {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div class="greeting">Welcome back, Media Explorer</div>
        <div class="status-info">
            <div class="time" id="currentTime">--:--</div>
            <div class="date" id="currentDate">Loading...</div>
        </div>
    </div>

    <div class="app-container">
        <div class="app-title">
            <h1>Archive Hub</h1>
            <div class="subtitle">Digital Entertainment System</div>
        </div>

        <nav class="main-nav" id="mainNav">
            <button class="nav-btn active" data-type="movies">
                <span class="nav-icon">🎬</span>
                Movies
            </button>
            <button class="nav-btn" data-type="tv">
                <span class="nav-icon">📺</span>
                TV Shows
            </button>
            <button class="nav-btn" data-type="music">
                <span class="nav-icon">🎵</span>
                Music
            </button>
            <button class="nav-btn" data-type="audiobooks">
                <span class="nav-icon">📚</span>
                Audiobooks
            </button>
            <button class="nav-btn" data-type="radio">
                <span class="nav-icon">📻</span>
                Radio
            </button>
            <button class="nav-btn" data-type="podcasts">
                <span class="nav-icon">🎙️</span>
                Podcasts
            </button>
            <button class="nav-btn" data-type="games">
                <span class="nav-icon">🕹️</span>
                Games
            </button>
            <button class="nav-btn" data-type="favorites">
                <span class="nav-icon">❤️</span>
                Favorites
                <span class="badge" id="favoritesBadge" style="display: none;">0</span>
            </button>
            <button class="nav-btn" data-type="recentlyPlayed">
                <span class="nav-icon">🕐</span>
                Recent
                <span class="badge" id="recentBadge" style="display: none;">0</span>
            </button>
        </nav>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>Loading content...</div>
        </div>

        <div id="contentContainer"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <button id="backToTop" class="back-to-top" onclick="scrollToTop()" title="Back to top">↑</button>

    <script>
        // ============================================================================
        // UTILITY FUNCTIONS
        // ============================================================================

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Debounce utility
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ============================================================================
        // STORAGE MANAGER - Handle localStorage for favorites and recently played
        // ============================================================================

        const StorageManager = {
            FAVORITES_KEY: 'archive_favorites',
            RECENT_KEY: 'archive_recently_played',
            MAX_RECENT: 20,

            addFavorite(identifier, itemData) {
                try {
                    const favorites = this.getFavorites();
                    const exists = favorites.find(f => f.identifier === identifier);
                    if (!exists) {
                        favorites.push({
                            identifier,
                            title: itemData.title,
                            type: itemData.type,
                            thumbnail: itemData.thumbnail
                        });
                        localStorage.setItem(this.FAVORITES_KEY, JSON.stringify(favorites));
                        this.updateFavoritesBadge();
                    }
                } catch (e) {
                    console.error('Error adding favorite:', e);
                }
            },

            removeFavorite(identifier) {
                try {
                    const favorites = this.getFavorites();
                    const filtered = favorites.filter(f => f.identifier !== identifier);
                    localStorage.setItem(this.FAVORITES_KEY, JSON.stringify(filtered));
                    this.updateFavoritesBadge();
                } catch (e) {
                    console.error('Error removing favorite:', e);
                }
            },

            isFavorite(identifier) {
                try {
                    const favorites = this.getFavorites();
                    return favorites.some(f => f.identifier === identifier);
                } catch (e) {
                    return false;
                }
            },

            getFavorites() {
                try {
                    const data = localStorage.getItem(this.FAVORITES_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            },

            addToRecentlyPlayed(identifier, itemData) {
                try {
                    const recent = this.getRecentlyPlayed();
                    // Remove if exists (to move to end)
                    const filtered = recent.filter(r => r.identifier !== identifier);
                    // Add to end with timestamp
                    filtered.push({
                        identifier,
                        title: itemData.title,
                        type: itemData.type,
                        thumbnail: itemData.thumbnail,
                        timestamp: Date.now()
                    });
                    // Cap at MAX_RECENT
                    if (filtered.length > this.MAX_RECENT) {
                        filtered.shift();
                    }
                    localStorage.setItem(this.RECENT_KEY, JSON.stringify(filtered));
                    this.updateRecentBadge();
                } catch (e) {
                    console.error('Error adding to recent:', e);
                }
            },

            getRecentlyPlayed() {
                try {
                    const data = localStorage.getItem(this.RECENT_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            },

            updateFavoritesBadge() {
                const badge = document.getElementById('favoritesBadge');
                const count = this.getFavorites().length;
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            },

            updateRecentBadge() {
                const badge = document.getElementById('recentBadge');
                const count = this.getRecentlyPlayed().length;
                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            }
        };

        // Update badges on load
        document.addEventListener('DOMContentLoaded', () => {
            StorageManager.updateFavoritesBadge();
            StorageManager.updateRecentBadge();
        });

        // ============================================================================
        // DATE/TIME UPDATE
        // ============================================================================

        function updateDateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            const dateStr = now.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });

            document.getElementById('currentTime').textContent = timeStr;
            document.getElementById('currentDate').textContent = dateStr;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ============================================================================
        // CONTENT CONFIGURATION
        // ============================================================================

        const CONTENT_TYPES = {
            movies: {
                name: 'Movies',
                query: 'mediatype:movies AND (collection:"feature_films" OR collection:"classic_cinema") AND language:English',
                genres: {
                    'Action': ['action', 'adventure', 'martial arts', 'war', 'western'],
                    'Comedy': ['comedy', 'slapstick', 'romantic comedy', 'satire'],
                    'Drama': ['drama', 'melodrama', 'historical drama'],
                    'Horror': ['horror', 'thriller', 'suspense', 'terror', 'monster'],
                    'Sci-Fi': ['science fiction', 'sci-fi', 'scifi', 'space', 'futuristic'],
                    'Mystery': ['mystery', 'detective', 'crime', 'noir', 'film noir'],
                    'Romance': ['romance', 'romantic', 'love story'],
                    'Animation': ['animation', 'animated', 'cartoon']
                }
            },
            tv: {
                name: 'TV Shows',
                query: 'mediatype:movies AND (collection:classic_tv OR collection:classic_tv_1970s OR collection:classic_tv_1960s)',
                genres: {
                    'Drama': ['drama', 'series'],
                    'Comedy': ['comedy', 'sitcom'],
                    'News': ['news', 'newscast'],
                    'Documentary': ['documentary', 'educational'],
                    'Talk Shows': ['talk show', 'interview'],
                    'Variety': ['variety', 'entertainment'],
                    'Classic TV': ['classic', 'vintage']
                }
            },
            music: {
                name: 'Music',
                query: 'mediatype:audio AND (collection:the-vinyl-box OR collection:radiostationarchives OR collection:hifidelity_soundtracks)',
                genres: {
                    'Rock': ['rock', 'rock and roll', 'metal'],
                    'Jazz': ['jazz', 'swing'],
                    'Classical': ['classical', 'orchestra', 'symphony'],
                    'Blues': ['blues'],
                    'Folk': ['folk', 'acoustic'],
                    'Electronic': ['electronic', 'techno'],
                    'Live Concerts': ['live', 'concert', 'performance'],
                    'Soundtracks': ['soundtrack']
                }
            },
            audiobooks: {
                name: 'Audiobooks',
                query: 'mediatype:audio AND collection:audio_bookspoetry',
                genres: {
                    'Fiction': ['fiction', 'novel'],
                    'Classic Literature': ['classic', 'literature'],
                    'Poetry': ['poetry', 'poems'],
                    'Non-Fiction': ['non-fiction', 'nonfiction'],
                    'Children': ['children', 'kids', 'juvenile'],
                    'Mystery': ['mystery', 'detective'],
                    'Science Fiction': ['science fiction', 'sci-fi']
                }
            },
            radio: {
                name: 'Old Time Radio',
                query: 'mediatype:audio AND (collection:radioprograms OR collection:oldtimeradio)',
                genres: {
                    'Drama': ['drama', 'theater'],
                    'Comedy': ['comedy', 'humor'],
                    'Mystery': ['mystery', 'suspense'],
                    'Science Fiction': ['science fiction', 'sci-fi'],
                    'Adventure': ['adventure', 'action'],
                    'Horror': ['horror', 'thriller'],
                    'Western': ['western', 'frontier']
                }
            },
            podcasts: {
                name: 'Podcasts',
                query: 'mediatype:audio AND collection:podcasts',
                genres: {
                    'News': ['news', 'current events'],
                    'Technology': ['technology', 'tech', 'digital'],
                    'Education': ['education', 'educational'],
                    'Arts': ['arts', 'culture'],
                    'Science': ['science', 'research'],
                    'History': ['history', 'historical'],
                    'Politics': ['politics', 'political']
                }
            },
            games: {
                name: 'Games',
                query: 'mediatype:software AND (collection:internetarcade OR collection:softwarelibrary_msdos_games OR collection:consolelivingroom)',
                isGames: true,
                genres: {
                    'Action': ['action', 'fighting', 'beat em up', 'beat-em-up', 'shooter', 'shooting'],
                    'Arcade': ['arcade', 'coin-op', 'coin operated'],
                    'Puzzle': ['puzzle', 'tetris', 'logic', 'brain'],
                    'Strategy': ['strategy', 'tactical', 'simulation', 'sim'],
                    'Adventure': ['adventure', 'point and click', 'interactive fiction', 'text adventure'],
                    'RPG': ['rpg', 'role-playing', 'role playing', 'roleplaying'],
                    'Sports': ['sports', 'racing', 'football', 'baseball', 'basketball', 'soccer', 'golf', 'tennis'],
                    'Platformer': ['platform', 'platformer', 'side-scrolling', 'side scrolling']
                }
            },
            favorites: {
                name: 'Favorites',
                isFavorites: true
            },
            recentlyPlayed: {
                name: 'Recently Played',
                isRecentlyPlayed: true
            }
        };

        let currentContentType = 'movies';
        let contentData = {};
        let itemsPerGenre = 100;
        let currentGenre = 'All';

        // ============================================================================
        // API & DATA FETCHING
        // ============================================================================

        async function fetchContent(type) {
            try {
                const config = CONTENT_TYPES[type];

                // Handle special collection types
                if (config.isFavorites) {
                    const favorites = StorageManager.getFavorites();
                    contentData[type] = {
                        items: favorites,
                        categorized: { 'All': favorites }
                    };
                    return contentData[type];
                }

                if (config.isRecentlyPlayed) {
                    const recent = StorageManager.getRecentlyPlayed();
                    contentData[type] = {
                        items: recent.reverse(),
                        categorized: { 'All': recent.reverse() }
                    };
                    return contentData[type];
                }

                // Normal API fetch
                const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(config.query)}&fl[]=identifier,title,description,year,subject,creator&sort[]=downloads+desc&rows=500&output=json`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }
                const data = await response.json();

                if (!data.response || !data.response.docs || data.response.docs.length === 0) {
                    contentData[type] = {
                        items: [],
                        categorized: { 'All': [] },
                        noResults: true
                    };
                    return contentData[type];
                }

                contentData[type] = {
                    items: data.response.docs,
                    categorized: categorizeContent(data.response.docs, config.genres)
                };

                return contentData[type];
            } catch (error) {
                console.error(`Error fetching ${type}:`, error);
                contentData[type] = {
                    items: [],
                    categorized: {},
                    error: error.message
                };
                return null;
            }
        }

        function categorizeContent(items, genreMapping) {
            const categorized = {};

            Object.keys(genreMapping).forEach(genre => {
                categorized[genre] = [];
            });
            categorized['All'] = items;

            items.forEach(item => {
                let subjects = item.subject || [];
                if (!Array.isArray(subjects)) {
                    subjects = [subjects];
                }
                const subjectsLower = subjects.map(s => String(s).toLowerCase());

                for (const [genre, keywords] of Object.entries(genreMapping)) {
                    for (const keyword of keywords) {
                        if (subjectsLower.some(subject => subject.includes(keyword))) {
                            categorized[genre].push(item);
                            break;
                        }
                    }
                }
            });

            return categorized;
        }

        // ============================================================================
        // SEARCH & FILTER
        // ============================================================================

        function filterItems(items, query) {
            if (!query || query.trim().length < 3) {
                return items;
            }

            const q = query.toLowerCase();
            return items.filter(item => {
                const title = (item.title || '').toLowerCase();
                const description = (item.description || '').toLowerCase();
                let subject = (item.subject || '');
                if (Array.isArray(subject)) {
                    subject = subject.join(' ').toLowerCase();
                } else {
                    subject = String(subject).toLowerCase();
                }

                return title.includes(q) || description.includes(q) || subject.includes(q);
            });
        }

        const handleSearch = debounce(function(type) {
            const searchInput = document.getElementById(`searchInput-${type}`);
            if (!searchInput) return;

            const query = searchInput.value.trim();
            showGenre(type, currentGenre, query);
        }, 400);

        // ============================================================================
        // RENDERING
        // ============================================================================

        function renderContent(type) {
            const container = document.getElementById('contentContainer');
            const data = contentData[type];

            if (!data) {
                container.innerHTML = '<div class="error">Failed to load content. Please try again.</div>';
                return;
            }

            if (data.error) {
                container.innerHTML = `
                    <div class="error-card">
                        <div class="error-card-title">⚠️ Error Loading Content</div>
                        <div class="error-card-message">${escapeHtml(data.error)}</div>
                        <button class="btn btn-primary" onclick="retryFetch('${type}')">🔄 Retry</button>
                    </div>
                `;
                return;
            }

            if (data.noResults) {
                container.innerHTML = '<div class="no-content">⚠️ No results available for this category</div>';
                return;
            }

            const config = CONTENT_TYPES[type];
            const isFavoritesOrRecent = config.isFavorites || config.isRecentlyPlayed;

            let html = `
                <div class="content-section active">
            `;

            // Search bar
            html += `
                <div class="search-bar">
                    <div style="position: relative; display: inline-block; width: 100%; max-width: 500px;">
                        <input type="text"
                               id="searchInput-${type}"
                               class="search-input"
                               placeholder="Search ${config.name.toLowerCase()}..."
                               oninput="handleSearch('${type}')">
                        <button class="search-clear-btn" onclick="clearSearch('${type}')">✕</button>
                    </div>
                    <div class="search-info" id="searchInfo-${type}"></div>
                </div>
            `;

            // Genre tabs (skip for favorites/recent)
            if (!isFavoritesOrRecent) {
                const genres = ['All', ...Object.keys(config.genres)];
                html += `<div class="genre-tabs" id="genreTabs-${type}">`;

                genres.forEach(genre => {
                    const count = data.categorized[genre]?.length || 0;
                    if (count > 0) {
                        html += `<button class="genre-tab ${genre === 'All' ? 'active' : ''}" data-genre="${genre}" data-type="${type}">${genre} (${count})</button>`;
                    }
                });

                html += `</div>`;
            }

            html += `
                    <div id="itemsContainer-${type}"></div>
                </div>
            `;

            container.innerHTML = html;

            // Attach genre tab listeners
            if (!isFavoritesOrRecent) {
                document.querySelectorAll(`#genreTabs-${type} .genre-tab`).forEach(tab => {
                    tab.addEventListener('click', () => {
                        const genre = tab.getAttribute('data-genre');
                        document.querySelectorAll(`#genreTabs-${type} .genre-tab`).forEach(t => {
                            t.classList.remove('active');
                        });
                        tab.classList.add('active');
                        currentGenre = genre;
                        showGenre(type, genre);
                    });
                });
            }

            currentGenre = 'All';
            itemsPerGenre = 100;
            showGenre(type, 'All');
            setupLazyLoading();
        }

        function showGenre(type, genre, searchQuery = '') {
            const container = document.getElementById(`itemsContainer-${type}`);
            if (!container) return;

            const data = contentData[type];
            let items = data.categorized[genre] || [];

            // Apply search filter if query provided
            if (searchQuery) {
                items = filterItems(items, searchQuery);
            }

            if (items.length === 0) {
                container.innerHTML = searchQuery
                    ? `<div class="no-content">No results for "${escapeHtml(searchQuery)}" in ${genre}</div>`
                    : '<div class="no-content">No content found in this category</div>';
                return;
            }

            // Update search info
            const searchInfo = document.getElementById(`searchInfo-${type}`);
            if (searchInfo) {
                if (searchQuery) {
                    searchInfo.textContent = `${items.length} result${items.length !== 1 ? 's' : ''} for "${escapeHtml(searchQuery)}"`;
                } else {
                    searchInfo.textContent = '';
                }
            }

            let html = '<div class="items-grid">';

            // Render items up to current limit
            items.slice(0, itemsPerGenre).forEach(item => {
                html += createItemCard(item, type);
            });

            html += '</div>';

            // Add Load More button if applicable
            if (items.length > itemsPerGenre) {
                html += `
                    <div class="load-more-container">
                        <button class="btn btn-secondary" onclick="loadMoreItems('${type}', '${genre}')">
                            📥 Load More (${items.length - itemsPerGenre} remaining)
                        </button>
                    </div>
                `;
            }

            container.innerHTML = html;
            setupLazyLoading();
        }

        function loadMoreItems(type, genre) {
            itemsPerGenre += 100;
            const searchInput = document.getElementById(`searchInput-${type}`);
            const searchQuery = searchInput ? searchInput.value.trim() : '';
            showGenre(type, genre, searchQuery);

            // Smooth scroll to load more button
            setTimeout(() => {
                const button = document.querySelector(`[onclick*="loadMoreItems('${type}']`);
                if (button) {
                    button.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 100);
        }

        function clearSearch(type) {
            const searchInput = document.getElementById(`searchInput-${type}`);
            if (searchInput) {
                searchInput.value = '';
                searchInput.classList.remove('active');
                handleSearch(type);
            }
        }

        function createItemCard(item, type) {
            const thumbnail = `https://archive.org/services/img/${item.identifier}`;
            const title = item.title || 'Untitled';
            const year = item.year || '';
            const creator = item.creator || '';
            const description = item.description ?
                (Array.isArray(item.description) ? item.description[0] : item.description) :
                'No description available';

            const isFavorited = StorageManager.isFavorite(item.identifier);

            let metaInfo = '';
            if (year) metaInfo += `${year}`;
            if (creator && type === 'music') metaInfo += ` • ${Array.isArray(creator) ? creator[0] : creator}`;

            return `
                <div class="item-card">
                    <div class="thumbnail-wrapper" id="thumb-${item.identifier}">
                        <img data-src="${thumbnail}"
                             alt="${title}"
                             class="item-thumbnail"
                             loading="lazy"
                             data-retry-count="0"
                             onerror="handleImageError(this)">
                    </div>
                    <div class="item-content">
                        <div class="item-title">${escapeHtml(title)}</div>
                        ${metaInfo ? `<div class="item-meta">${escapeHtml(metaInfo)}</div>` : ''}
                        <div class="item-description">${escapeHtml(String(description).substring(0, 150))}...</div>
                        <div class="item-actions">
                            <button class="btn btn-primary" data-identifier="${item.identifier}" data-title="${escapeHtml(title)}" data-type="${type}" onclick="playItemFromCard(event)">
                                ${CONTENT_TYPES[type]?.isGames ? '🕹️ Play' : '▶ Play'}
                            </button>
                            <button class="btn btn-secondary" onclick="window.open('https://archive.org/details/${item.identifier}', '_blank')">Details</button>
                            <button class="btn-heart ${isFavorited ? 'favorited' : ''}"
                                    title="${isFavorited ? 'Remove from favorites' : 'Add to favorites'}"
                                    onclick="toggleFavorite(event, '${item.identifier}', ${JSON.stringify({
                                        title: title,
                                        type: type,
                                        thumbnail: thumbnail
                                    }).replace(/'/g, '&quot;')})"
                                    style="padding: 12px;">
                                ${isFavorited ? '❤️' : '♡'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // FAVORITES & RECENTLY PLAYED
        // ============================================================================

        function toggleFavorite(event, identifier, itemData) {
            event.preventDefault();
            event.stopPropagation();

            if (StorageManager.isFavorite(identifier)) {
                StorageManager.removeFavorite(identifier);
            } else {
                StorageManager.addFavorite(identifier, itemData);
            }

            // Update button appearance
            const btn = event.target.closest('.btn-heart');
            if (btn) {
                btn.classList.toggle('favorited');
                btn.textContent = btn.classList.contains('favorited') ? '❤️' : '♡';
                btn.title = btn.classList.contains('favorited')
                    ? 'Remove from favorites'
                    : 'Add to favorites';
            }
        }

        function playItemFromCard(event) {
            event.preventDefault();
            event.stopPropagation();

            const btn = event.target.closest('.btn-primary');
            const identifier = btn.getAttribute('data-identifier');
            const title = btn.getAttribute('data-title');
            const type = btn.getAttribute('data-type');

            playItem(identifier, title, type);
        }

        // ============================================================================
        // MODAL & PLAYBACK
        // ============================================================================

        function playItem(identifier, title, type) {
            // Track in recently played
            StorageManager.addToRecentlyPlayed(identifier, {
                title: title,
                type: type,
                identifier: identifier,
                thumbnail: `https://archive.org/services/img/${identifier}`
            });

            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const isGame = CONTENT_TYPES[type]?.isGames;
            const playerClass = isGame ? 'game' : '';

            content.innerHTML = `
                <h2 class="modal-title">${escapeHtml(title)}</h2>
                <div class="player-container ${playerClass}">
                    <iframe src="https://archive.org/embed/${identifier}" allowfullscreen allow="autoplay"></iframe>
                </div>
                <div class="modal-meta">${isGame ? 'Running in browser via Archive.org emulation' : 'Streaming from Archive.org'}</div>
                <button class="btn btn-primary" onclick="window.open('https://archive.org/details/${identifier}', '_blank')">
                    View on Archive.org
                </button>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.getElementById('modalContent').innerHTML = '';
        }

        // ============================================================================
        // NAVIGATION
        // ============================================================================

        async function switchContent(type) {
            if (type === currentContentType) return;

            currentContentType = type;
            itemsPerGenre = 100;
            currentGenre = 'All';

            // Update active nav button
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-type="${type}"]`).classList.add('active');

            // Fetch if not already cached
            if (!contentData[type]) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('contentContainer').innerHTML = '';

                await fetchContent(type);

                document.getElementById('loading').style.display = 'none';
            }

            renderContent(type);
        }

        function retryFetch(type) {
            contentData[type] = null;
            switchContent(type);
        }

        // ============================================================================
        // EVENT LISTENERS
        // ============================================================================

        document.addEventListener('DOMContentLoaded', () => {
            // Setup nav button listeners
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.getAttribute('data-type');
                    switchContent(type);
                });
            });

            // Modal close on backdrop click
            document.getElementById('modal').addEventListener('click', (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            });

            // Modal close on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            // Back to top button
            const backToTopButton = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopButton.classList.add('visible');
                } else {
                    backToTopButton.classList.remove('visible');
                }
            });

            // Search input styling
            document.addEventListener('input', (e) => {
                if (e.target.classList.contains('search-input')) {
                    if (e.target.value.trim().length > 0) {
                        e.target.classList.add('active');
                    } else {
                        e.target.classList.remove('active');
                    }
                }
            });
        });

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // ============================================================================
        // IMAGE LOADING & LAZY LOADING
        // ============================================================================

        function handleImageError(img) {
            const retryCount = parseInt(img.getAttribute('data-retry-count')) || 0;
            const maxRetries = 3;

            if (retryCount < maxRetries) {
                setTimeout(() => {
                    img.setAttribute('data-retry-count', retryCount + 1);
                    const src = img.getAttribute('data-src');
                    img.src = src + (src.includes('?') ? '&' : '?') + 'retry=' + retryCount;
                }, 1000 * (retryCount + 1));
            } else {
                const wrapper = img.parentElement;
                if (!wrapper.querySelector('.thumbnail-retry')) {
                    const retryBtn = document.createElement('button');
                    retryBtn.className = 'thumbnail-retry';
                    retryBtn.innerHTML = '🔄 Reload Image';
                    retryBtn.onclick = function(e) {
                        e.stopPropagation();
                        img.setAttribute('data-retry-count', '0');
                        const src = img.getAttribute('data-src');
                        img.src = src + (src.includes('?') ? '&' : '?') + 'manual=' + Date.now();
                        retryBtn.remove();
                    };
                    wrapper.appendChild(retryBtn);
                }
                img.style.display = 'none';
            }
        }

        // Lazy loading with Intersection Observer
        function setupLazyLoading() {
            if ('IntersectionObserver' in window) {
                const imageObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            setTimeout(() => {
                                const src = img.getAttribute('data-src');
                                if (src && !img.src) {
                                    img.src = src;
                                }
                            }, Math.random() * 200);
                            observer.unobserve(img);
                        }
                    });
                }, {
                    rootMargin: '50px'
                });

                // Observe all images without src
                document.querySelectorAll('img[data-src]:not([src])').forEach(img => {
                    imageObserver.observe(img);
                });
            }
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        async function init() {
            await fetchContent('movies');
            document.getElementById('loading').style.display = 'none';
            renderContent('movies');
            setupLazyLoading();
        }

        init();
    </script>
